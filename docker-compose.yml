# SafeWay AI - local / staging orchestration.
#
#   docker compose up --build                 # local stack (SQLite, no demo seed)
#   docker compose --profile postgres up -d   # with PostgreSQL + Redis
#   docker compose --profile postgres run --rm backend-migrate
#
# The default stack keeps SQLite so it runs with no external services. Use the
# postgres profile for anything that resembles production.

name: safeway

services:
  backend:
    build:
      context: ./backend
    image: safeway/backend:local
    restart: unless-stopped
    env_file:
      # Optional: copy backend/.env.example to backend/.env to override settings.
      # Long syntax keeps the file optional (Compose >= 2.24).
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/safeway.db}
      REDIS_URL: ${REDIS_URL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  backend-migrate:
    profiles: ["postgres", "migrate"]
    build:
      context: ./backend
    image: safeway/backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://safeway:safeway@db:5432/safeway}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_URL: http://backend:8000
    image: safeway/frontend:local
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeway
      POSTGRES_PASSWORD: safeway
      POSTGRES_DB: safeway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeway -d safeway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["postgres"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data

volumes:
  backend-data:
  postgres-data:
  redis-data:
